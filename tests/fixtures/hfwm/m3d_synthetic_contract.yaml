schema_version: hfwm.r0.m3d.synthetic-fixture.v1
synthetic_only: true
data_status: CONTRACT_FIXTURE_ONLY
contains_partner_data: false
contains_patient_identifiers: false

count_rate_divergence:
  t0:
    patient_census_count: 10
    physical_presence_count: 9
    open_bed_count: 12
    occupancy_rate: 0.8333333333333334
  t1:
    patient_census_count: 10
    physical_presence_count: 9
    open_bed_count: 10
    occupancy_rate: 1.0

closed_interval:
  interval: "[2026-01-01T00:00:00Z,2026-01-01T06:00:00Z)"
  census_start: 10
  external_entries: 4
  internal_inbound_transfers: 1
  external_exits: 3
  internal_outbound_transfers: 1
  other_signed_census_adjustments: 1
  census_end: 12
  event_examples:
    - effective_external_admission
    - birth_when_entering_census
    - return_from_permission
    - effective_discharge
    - death
    - leave_permission
    - correction

transfer_events:
  - event_type: internal_outbound_transfer
    transfer_event_id: transfer-ok-001
    source_unit_id: unit-a
    destination_unit_id: unit-b
    event_time: "2026-01-01T02:00:00Z"
  - event_type: internal_inbound_transfer
    transfer_event_id: transfer-ok-001
    source_unit_id: unit-a
    destination_unit_id: unit-b
    event_time: "2026-01-01T02:00:00Z"
broken_transfer_events:
  - event_type: internal_outbound_transfer
    transfer_event_id: transfer-broken-001
    source_unit_id: unit-a
    destination_unit_id: unit-c
    event_time: "2026-01-01T03:00:00Z"

operating_room_conventions:
  source_census_retained:
    departure_changes_census: false
    return_changes_census: false
    physical_presence_changes: true
  source_census_exited:
    departure_changes_census: true
    return_changes_census: true
    physical_presence_changes: true

future_correction:
  event_time: "2026-01-01T01:00:00Z"
  original_recorded_at: "2026-01-01T01:05:00Z"
  correction_available_at: "2026-01-03T09:00:00Z"
  analysis_as_of: "2026-01-02T00:00:00Z"
  visible_at_analysis_as_of: false

missing_available_at:
  event_time: "2026-01-01T01:00:00Z"
  extract_generated_at: "2026-02-01T00:00:00Z"
  available_at: null
  allowed_claim: RETROSPECTIVE_ONLY_WITH_EXPLICIT_LIMIT

source_outage:
  hospital_site_id: synthetic-site-1
  unit_id: synthetic-unit-outage
  temporal_block_id: synthetic-block-1
  affected_source: ADT
  complete: false

small_cell:
  hospital_site_id: synthetic-site-1
  unit_id: synthetic-unit-small
  interval_count: 2
  release_policy: PARTNER_DEFINED_CONTROL_REQUIRED

