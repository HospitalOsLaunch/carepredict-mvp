# Tool configuration only: each service has its own requirements file and Dockerfile.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config"
testpaths = ["services/admissions_smr/tests", "services/admissions_agent/tests", "tools/tests"]
pythonpath = ["."]
