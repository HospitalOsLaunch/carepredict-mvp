name: research-lab-guarded

on:
  pull_request:
    paths:
      - 'research_lab/**'
      - 'tests/test_research_lab.py'
      - '.github/workflows/research-lab-guarded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency only
        run: python -m pip install 'pytest>=8,<10'
      - name: Test guarded runtime without network or LLM
        run: python -m pytest -q tests/test_research_lab.py
