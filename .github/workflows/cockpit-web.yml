name: cockpit-web

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/hospitalos/hybrid/**'
      - 'services/api/hybrid_app.py'
      - '.github/workflows/cockpit-web.yml'
  push:
    branches: ['main']
    paths:
      - 'web/**'
      - 'src/hospitalos/hybrid/**'

permissions:
  contents: read

jobs:
  cockpit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install planner dependencies
        run: python -m pip install 'pydantic>=2.7,<3' 'scikit-learn>=1.5,<1.9'
      - name: Fixtures match the current planner
        run: |
          PYTHONPATH=src:. python web/dev/build_fixtures.py
          git diff --exit-code -- web/src/fixtures
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck, tests, builds
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run build:demo
