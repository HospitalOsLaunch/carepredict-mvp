name: operational-foundation

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  common-interface:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU experiment dependencies
        run: |
          python -m pip install 'torch==2.4.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pydantic>=2.7,<3' 'pytest>=8.2,<9' 'ruff>=0.4,<1' 'mypy>=1.10,<2'
      - name: Check common contract and first model
        run: |
          python -m ruff check src/hospitalos/operational tests/operational
          python -m ruff format --check src/hospitalos/operational tests/operational
          python -m mypy --strict src/hospitalos/operational tests/operational
          python -m pytest -q tests/operational
