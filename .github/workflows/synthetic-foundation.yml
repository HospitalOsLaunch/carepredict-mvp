name: synthetic-foundation

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Regression test loads the pinned lot 03 engine from Git.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pydantic>=2.7,<3' 'scikit-learn>=1.5,<1.9' 'pytest>=8.2,<9' 'ruff>=0.4,<1' 'mypy>=1.10,<2'
      - name: Lint new foundation
        run: |
          python -m ruff check src/hospitalos/synthetic tests/synthetic
          python -m ruff format --check src/hospitalos/synthetic tests/synthetic
      - name: Type-check new foundation
        run: python -m mypy --strict src/hospitalos/synthetic/dynamics.py src/hospitalos/synthetic/config.py src/hospitalos/synthetic/engine.py src/hospitalos/synthetic/generate.py src/hospitalos/synthetic/__main__.py src/hospitalos/synthetic/observations.py src/hospitalos/synthetic/asof.py src/hospitalos/synthetic/baseline24.py src/hospitalos/synthetic/learning.py src/hospitalos/synthetic/registry.py src/hospitalos/synthetic/cohort.py src/hospitalos/synthetic/mechanisms.py src/hospitalos/synthetic/counterfactual.py src/hospitalos/synthetic/benchmark.py src/hospitalos/synthetic/online.py src/hospitalos/synthetic/policy.py src/hospitalos/synthetic/policy_loop.py tests/synthetic
      - name: Test multi-pole contracts
        run: python -m pytest -q tests/synthetic
      - name: Test imported v0.4.1 regressions and mutations
        run: python -m hospitalos.synthetic.v041.tests
      - name: Run one synthetic year
        run: python -m hospitalos.synthetic --config configs/synthetic/hospital_two_poles.json --output runs/synthetic/annual
      - name: Replay as-of observations and score 24h reference
        run: python -m hospitalos.synthetic.learning --source runs/synthetic/annual --output runs/synthetic/asof-annual
      - name: Freeze and materialize a disposable cohort fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("configs/synthetic/cohort_structures_v1.json").read_text())
          plan.update(cohort_id="C_CI_FIXTURE", days=10, warmup_days=2)
          Path("runs/synthetic/ci-cohort-plan.json").write_text(json.dumps(plan))
          PY
          python -m hospitalos.synthetic.cohort freeze --plan runs/synthetic/ci-cohort-plan.json --output runs/synthetic/ci-registry
          python -m hospitalos.synthetic.cohort generate --registry runs/synthetic/ci-registry --output runs/synthetic/ci-cohort --with-learning
      - name: Freeze and execute train-only references on the disposable fixture
        run: |
          python -m hospitalos.synthetic.benchmark freeze --registry runs/synthetic/ci-registry --cohort runs/synthetic/ci-cohort --protocol runs/synthetic/ci-benchmark-protocol.json
          python -m hospitalos.synthetic.benchmark run --registry runs/synthetic/ci-registry --cohort runs/synthetic/ci-cohort --protocol runs/synthetic/ci-benchmark-protocol.json --output runs/synthetic/ci-benchmark
      - name: Exercise local resources, mechanism reservation and paired 72h scenarios
        run: |
          python -m hospitalos.synthetic --config configs/synthetic/hospital_local_v1.json --days 7 --output runs/synthetic/local-smoke
          python -m hospitalos.synthetic.cohort freeze --plan configs/synthetic/cohort_mechanisms_v1.json --output runs/synthetic/mechanism-registry
          python -m hospitalos.synthetic.counterfactual --config configs/synthetic/hospital_v041.json --alternative configs/synthetic/hospital_hybrid_v1.json --at-hour 9 --horizon 72 --output runs/synthetic/paired-smoke
      - name: Run observation-only policy and decision ledger
        run: |
          python -m hospitalos.synthetic.policy_loop --config configs/synthetic/hospital_two_poles.json --days 10 --output runs/synthetic/policy-smoke
      - name: Freeze independent dynamics reservations (no test trajectories)
        run: |
          python -m hospitalos.synthetic.cohort freeze --plan configs/synthetic/cohort_arrivals_v1.json --output runs/synthetic/arrivals-registry
          python -m hospitalos.synthetic.cohort freeze --plan configs/synthetic/cohort_discharges_v1.json --output runs/synthetic/discharges-registry
          python -m hospitalos.synthetic.cohort freeze --plan configs/synthetic/cohort_staffing_v1.json --output runs/synthetic/staffing-registry
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-annual-manifest
          path: |
            runs/synthetic/annual/manifest.json
            runs/synthetic/annual/config.json
            runs/synthetic/asof-annual/manifest.json
            runs/synthetic/asof-annual/evaluation/metrics.json
            runs/synthetic/ci-registry/registry.json
            runs/synthetic/ci-registry/manifest.json
            runs/synthetic/ci-cohort/manifest.json
            runs/synthetic/ci-benchmark-protocol.json
            runs/synthetic/ci-benchmark/manifest.json
            runs/synthetic/ci-benchmark/metrics.json
            runs/synthetic/ci-benchmark/models.pkl
            runs/synthetic/local-smoke/manifest.json
            runs/synthetic/mechanism-registry/manifest.json
            runs/synthetic/paired-smoke/manifest.json
            runs/synthetic/paired-smoke/outcomes.csv
            runs/synthetic/policy-smoke/manifest.json
            runs/synthetic/policy-smoke/policy.json
            runs/synthetic/policy-smoke/decisions/contexts.jsonl.gz
            runs/synthetic/policy-smoke/decisions/recommendations.jsonl.gz
            runs/synthetic/policy-smoke/decisions/ledger.jsonl.gz
            runs/synthetic/arrivals-registry/manifest.json
            runs/synthetic/discharges-registry/manifest.json
            runs/synthetic/staffing-registry/manifest.json
