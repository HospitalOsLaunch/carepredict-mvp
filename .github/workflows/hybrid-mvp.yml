name: hybrid-mvp

on:
  pull_request:
    paths:
      - 'src/hospitalos/hybrid/**'
      - 'src/hospitalos/operational/contract.py'
      - 'services/api/hybrid_app.py'
      - 'tests/hybrid/**'
      - '.github/workflows/hybrid-mvp.yml'
  push:
    branches: ['main']
    paths:
      - 'src/hospitalos/hybrid/**'
      - 'src/hospitalos/operational/contract.py'
      - 'services/api/hybrid_app.py'
      - 'tests/hybrid/**'
      - '.github/workflows/hybrid-mvp.yml'

permissions:
  contents: read

jobs:
  contracts-and-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated prototype dependencies
        run: python -m pip install 'pydantic>=2.7,<3' 'scikit-learn>=1.5,<1.9' pytest ruff mypy fastapi httpx
      - name: Lint and format
        run: |
          ruff check src/hospitalos/hybrid services/api/hybrid_app.py tests/hybrid
          ruff format --check src/hospitalos/hybrid services/api/hybrid_app.py tests/hybrid
      - name: Type check
        run: PYTHONPATH=src:. mypy --strict src/hospitalos/hybrid services/api/hybrid_app.py tests/hybrid
      - name: Tests
        run: PYTHONPATH=src:. pytest -q tests/hybrid
      - name: Demonstrator
        run: |
          PYTHONPATH=src python -m hospitalos.hybrid --demo
          PYTHONPATH=src python -m hospitalos.hybrid.shadow --demo
          PYTHONPATH=src python -m hospitalos.hybrid.source_cli --demo
          PYTHONPATH=src python -m hospitalos.hybrid --demo-pathway --show-trace
          PYTHONPATH=src python -m hospitalos.hybrid --demo-future --show-trace
          PYTHONPATH=src python -m hospitalos.hybrid.learning_demo
          PYTHONPATH=src python -m hospitalos.hybrid --demo-learned --show-trace
          PYTHONPATH=src python -m hospitalos.hybrid.retrospective --demo
          PYTHONPATH=src python -m hospitalos.hybrid.stress_preparation
          PYTHONPATH=src python -m hospitalos.hybrid.decision_benchmark
      - name: Corrected decision protocol and generated table validation
        run: PYTHONPATH=src python -m hospitalos.hybrid.robustness_v2 --check
