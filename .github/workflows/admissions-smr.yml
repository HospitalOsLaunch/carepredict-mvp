name: admissions-smr

on:
  pull_request:
    paths:
      - "services/admissions_smr/**"
      - "services/admissions_web/**"
      - ".github/workflows/admissions-smr.yml"
  push:
    branches: ["main"]
    paths:
      - "services/admissions_smr/**"
      - "services/admissions_web/**"

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (service dependencies only)
        run: python -m pip install -r services/admissions_smr/requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check services/admissions_smr
          ruff format --check services/admissions_smr
      - name: Type-check --strict
        run: mypy --strict services/admissions_smr
      - name: Tests (includes North Star calibration checks)
        run: pytest -q -p no:cacheprovider services/admissions_smr/tests

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/admissions_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/admissions_web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
