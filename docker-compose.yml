name: carepredict_mvp

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - carepredict

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infrastructure/redpanda/topics.yaml:/topics.yaml:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "rpk topic create sih.raw fhir.raw csv.raw canonical.events
      --brokers redpanda:9092 --partitions 3 --replicas 1 || true"
    networks:
      - carepredict

  timescaledb:
    image: timescale/timescaledb:2.14.2-pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepredict}
      POSTGRES_USER: ${POSTGRES_USER:-carepredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepredict_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - carepredict

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - carepredict

  dagster-postgres:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-dagster_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - dagster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - carepredict

  dagster-webserver:
    build:
      context: .
      dockerfile: infrastructure/dagster/Dockerfile
    env_file:
      - .env.example
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /app
    command: >
      sh -c "cd /app/orchestration/dagster
      && dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ./infrastructure/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      dagster-postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - carepredict

  dagster-daemon:
    build:
      context: .
      dockerfile: infrastructure/dagster/Dockerfile
    env_file:
      - .env.example
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /app
    command: >
      sh -c "cd /app/orchestration/dagster
      && dagster-daemon run -w workspace.yaml"
    volumes:
      - .:/app
      - ./infrastructure/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      dagster-postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - carepredict

  mlflow:
    build:
      context: .
      dockerfile: infrastructure/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - carepredict

  api:
    build:
      context: .
      dockerfile: infrastructure/api/Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - carepredict

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./services/dashboard:/app
      - dashboard-node-modules:/app/node_modules
    depends_on:
      - api
    networks:
      - carepredict

volumes:
  timescaledb-data:
  dagster-postgres-data:
  mlflow-data:
  dashboard-node-modules:

networks:
  carepredict:
    driver: bridge
