# Playbook of the fictional bed-management software (demo_bedsoft). Template for a real one:
# copy it, then replace the selectors and the label maps after inspecting its screens.
# Rules:
#   - selectors only, no coordinates; credentials come from the connection (or from the
#     agent's environment in legacy mode);
#   - only the fields listed below leave the screen. The patient's name and birth date are
#     shown by the software and are never read. IPP and venue number are pseudonymised by
#     HospitalOS on receipt (HMAC), never stored in clear.
# Catalogue header: the name a connection picks in HospitalOS, and the kind of software.
id: demo_bedsoft
kind: gestion_lits
name: Gestion des lits (démonstration)

# Player (docs/agent/PLAYER_SPEC.md): zones masked on this machine BEFORE any capture. The
# list shows each patient's name, the detail its name, birth date, IPP and venue number
# (clear identifiers: HospitalOS only ever stores them pseudonymised): masked, and the
# frame is withheld if a zone cannot be found on its screen. Password inputs and fields
# filled with credentials are always masked. Without this section, no frame at all.
privacy:
  mask:
    - {selector: "td.patient", reason: identite, screen: /mouvements}
    - {selector: "#patient", reason: identite, screen: "/mouvements/*"}
    - {selector: "#naissance", reason: identite, screen: "/mouvements/*"}
    - {selector: "#ipp", reason: identite, screen: "/mouvements/*"}
    - {selector: "#venue", reason: identite, screen: "/mouvements/*"}

# ``label``: what the player's transcript says of a step (static text, never a value).
login:
  - {goto: /connexion, label: "Ouvre la page de connexion du logiciel"}
  - fill: {selector: "#utilisateur", value: "{{ secrets.username }}"}
  - fill: {selector: "#mdp", value: "{{ secrets.password }}"}
  - {click: "button[type=submit]", label: "Valide la connexion"}
  - {wait_for: "[data-testid=mouvements]", label: "Attend la liste des mouvements"}

sync_movements:
  list:
    label: Ouvre la liste des mouvements du jour
    items: mouvements
    goto: /mouvements
    rows: "tr[data-id]"
    ref_attribute: data-id
    detail_path: "/mouvements/{{ ref }}"
  fields:
    movement_ref: {selector: "#id-mouvement"}
    event:
      selector: "#type"
      map:
        Entrée: A01
        Mutation: A02
        Sortie: A03
        Arrivée aux urgences: A04
        Hospitalisation depuis les urgences: A06
        Absence provisoire: A21
        Retour d'absence: A22
    action: {selector: "#statut", map: {Validé: INSERT, Annulé: CANCEL}}
    occurred_at: {selector: "#date-heure", transform: datetime_fr}
    encounter_id: {selector: "#venue"}
    patient_id: {selector: "#ipp"}
    sex: {selector: "#sexe", transform: sex_fr, optional: true}
    age: {selector: "#age", transform: int, optional: true}
    uf_code: {selector: "#uf"}
    room: {selector: "#chambre", optional: true}
    bed: {selector: "#lit", optional: true}
  constants:
    source_system: demo_bedsoft
