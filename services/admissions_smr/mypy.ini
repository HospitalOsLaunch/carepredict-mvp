# Type-checking of the admissions services (API and agent), separate from the monorepo's
# root configuration, which excludes them because it does not install their dependencies.
#   mypy --config-file services/admissions_smr/mypy.ini services/admissions_smr services/admissions_agent
[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_any_generics = True
disallow_subclassing_any = True
