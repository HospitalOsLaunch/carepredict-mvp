carepredict:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | int }}"
      user: "{{ env_var('POSTGRES_USER', 'carepredict') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'carepredict_dev_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'carepredict') }}"
      schema: marts
      threads: 4
