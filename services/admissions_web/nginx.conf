server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Every response, including those of the locations below that add their own header.
  include /etc/nginx/snippets/security_headers.conf;

  client_max_body_size 25m;

  # Compression: the JS goes from ~540 to ~160 Ko, a JSON answer of the API from tens of Ko to a
  # few (gzip_proxied any: /api/ answers come through proxy_pass). HTML is always compressed;
  # JPEG frames and WOFF2 fonts already are, so they are left alone.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store";
  }
}
