# Security headers of every response of the web image (Dockerfile copies this file to
# /etc/nginx/snippets/). Included by the server block AND by each location that adds its own
# header: nginx drops inherited add_header as soon as a level declares one.
# img-src blob: : the agent player fetches its masked frames with the bearer token and shows
# them through object URLs created by the page itself; no remote origin is allowed.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
