  - {path: docs/research/hfwm/HFWM_R0_M3D1_RELEASE_REVIEW.yaml, classification: SELF_LEDGER, release_phase: POST_TAG_REVIEW_SIDECAR}

ignored_patterns:
  - {pattern: .mypy_cache/**, classification: OUT_OF_RELEASE_WITH_REASON, reason: interpreter_cache}
  - {pattern: .pytest_cache/**, classification: OUT_OF_RELEASE_WITH_REASON, reason: test_cache}
  - {pattern: .ruff_cache/**, classification: OUT_OF_RELEASE_WITH_REASON, reason: lint_cache}
  - {pattern: '**/__pycache__/**', classification: OUT_OF_RELEASE_WITH_REASON, reason: Python_bytecode_cache}
  - {pattern: '**/*.pyc', classification: OUT_OF_RELEASE_WITH_REASON, reason: Python_bytecode}

classification_coverage_rule: >-
  Every discovered path under the release prefixes and every ignored path matching an
  ignored_pattern must have exactly one classification. Unlisted relevant files fail closed.
