schema_version: hfwm.r0.m3d1.release-scope.v1
purpose: >-
  Explicit classification of every M3D.1 release-relevant file discovered from the
  filesystem and Git. The final manifest is deliberately classified as a Commit-B file.
release_content_commit_excludes:
