blockers:
  - id: A3_PYTEST_FAILURE
    severity: P0
    evidence: >-
      Sur le checkout exact /private/tmp/carepredict-m3d1-A3, pytest
      tests/hfwm/m3d -q a retourné 41 tests passés et 2 échecs reproductibles :
      le test de trace AGORA trouve le commit historique 6cd4819 et le test de
      scope attend des fichiers ignorés absents d'un checkout nettoyé.
    impact: >-
      La validation Pytest requise sur les sources exactes A3 n'est pas PASS.
    required_action: >-
      Corriger la contradiction des tests dans une future version de contenu,
      puis réexécuter sur un checkout propre explicitement versionné ; A3 reste
      immuable pour cette release.
  - id: A3_RUFF_FAILURE
    severity: P0
    evidence: >-
      Ruff 0.15.16 sur A3 signale deux diagnostics E501 aux lignes 67 de
      src/hfwm/m3d/aggregation.py et 568 de src/hfwm/m3d/power.py.
    impact: La validation Ruff requise sur les sources exactes A3 n'est pas PASS.
    required_action: >-
      Corriger le formatage dans une future version de contenu ; aucun correctif
      n'est appliqué à A3/B3 dans ce milestone.
  - id: LOCAL_RELEASE_TEST_TOOLCHAIN_UNAVAILABLE
    severity: RESOLVED
    evidence: >-
      Une toolchain locale existante a été identifiée et attestée sans réseau :
      Python 3.11.15, pytest 8.4.2, Ruff 0.15.16, Mypy 1.19.1.
    impact: >-
      Ce blocker d'environnement est levé ; les échecs A3 de test et de lint
      restent indépendants.
    required_action: >-
      Conserver l'attestation et ne pas présenter l'environnement comme hermétique.

