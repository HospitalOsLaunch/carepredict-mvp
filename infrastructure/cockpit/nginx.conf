worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 3m;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Google Analytics hosts are allowed for production; the cockpit loads GA4 only in production and
        # only after the person's consent (src/analytics.ts).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Everything under /api goes through the platform gateway (accounts, settings, journal, and the
        # authenticated routes to the engines). Same path as the dev proxy in web/vite.config.ts.
        location /api/ {
            proxy_pass http://platform:8100;
            proxy_set_header Host $host;
            # Client address as set by the edge (Caddy overwrites X-Forwarded-For); used for login throttling.
            proxy_set_header X-Client-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For "";
            client_max_body_size 3m;
        }
        location / {
            try_files $uri /index.html;
        }
    }
}
