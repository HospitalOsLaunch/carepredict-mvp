worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

        # Same routes as web/vite.config.ts: the 24-hour engine first, then the hybrid API.
        location /api/decision/ {
            proxy_pass http://decision-api:8765/api/;
        }
        location /api/ {
            proxy_pass http://hybrid-api:8000/;
        }
        location / {
            try_files $uri /index.html;
        }
    }
}
